<ion-header><ion-toolbar><ion-buttons slot="start"><ion-back-button defaultHref="/home"></ion-back-button></ion-buttons><ion-title>Ion Reorder</ion-title></ion-toolbar></ion-header><ion-content class="ion-padding"><h1>Ion Reorder</h1><p>Sirve para permitir que el usuario cambie el orden de una lista.</p><h2>Código</h2><pre>&lt;ion-reorder-group&gt;...&lt;/ion-reorder-group&gt;</pre><h2>Ejemplo</h2><ion-reorder-group [disabled]="false" (ionItemReorder)="reordenar($event)"><ion-item *ngFor="let elemento of elementos"><ion-label>{{ elemento }}</ion-label><ion-reorder slot="end"></ion-reorder></ion-item></ion-reorder-group></ion-content>
